<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>组会纪要</title>
  </head>
  <body>
    <main>
      <h1>组会纪要</h1>
      <form id="note-form">
        <label>
          标题
          <input id="title" name="title" maxlength="120" required>
        </label>
        <label>
          纪要
          <textarea id="body" name="body" maxlength="4000"></textarea>
        </label>
        <button type="submit">保存纪要</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">已保存纪要</h2>
        <ul id="notes"></ul>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
